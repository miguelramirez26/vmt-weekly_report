<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>VMT Weekly Report</title>
    <meta name="theme-color" content="#f5f6f5">
    <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1Dww1zwc65D4k1rhbg1ZNpmOwam4TPa2d=s512">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1Dww1zwc65D4k1rhbg1ZNpmOwam4TPa2d=s512">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="VMT Weekly Report">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CABECERA -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-vmt">VMT</span>
            <span class="brand-company">Pepperl+Fuchs</span>
        </div>
        <span class="internal-label">GESTIÓN INTERNA</span>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <img class="app-icon" src="https://lh3.googleusercontent.com/d/1Dww1zwc65D4k1rhbg1ZNpmOwam4TPa2d=s512" alt="VMT Weekly Report">
        <h1 id="matrix-title">VMT Weekly Report</h1>
        <p class="subtitle"> Registro diario de horas </p>
        <section class="access-card">
            <p> Accede a VMT Weekly Report para registrar tus horas cada día, rellenar tu Excel semanal y ver tus horas extra. </p>
            <a class="open-button" href="https://script.google.com/macros/s/AKfycbxbohzIt6fcHIWsGGfBsoTXR3u9MOB1VKFfPAkwscpoSiREfIW3eKmoPWWnm6DyUsM1ig/exec" id="openLink">
                <span id="openButtonText">Abrir VMT Weekly Report</span>
                <span class="arrow">→</span>
            </a>
            <div class="access-note">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg> Acceso mediante tu cuenta de Google </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <span class="footer-company">Pepperl+Fuchs</span>
        <span class="footer-tagline">Tus horas, simplificadas</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
